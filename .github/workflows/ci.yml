name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # bin/build stamps the VERSION file into every generated install.php and
  # updater.php as INSTALLER_VERSION/UPDATER_VERSION, but Composer resolves
  # releases from the git tag alone. release-please bumps VERSION, the manifest
  # and the tag together; this catches them drifting apart anyway (a hand edit
  # of VERSION, a hand-pushed tag), so customers never get a build labelled
  # with a version they aren't running.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: VERSION matches the release-please manifest and the tag
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"

          if [ "$file_version" != "$manifest_version" ]; then
            echo "::error::VERSION says '${file_version}' but .release-please-manifest.json says '${manifest_version}'. Don't edit VERSION by hand; release-please bumps both."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$file_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::VERSION says '${file_version}' but the tag is '${GITHUB_REF_NAME}'."
            exit 1
          fi

          echo "VERSION '${file_version}' is consistent."

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Run tests
        run: vendor/bin/pest --parallel

  # The generated install.php/updater.php are single files, so PHP compiles
  # every line before running any. Syntax newer than the customer's PHP
  # (trait constants, enums, readonly, the 8.5 pipe operator...) is a fatal
  # error before the requirements page can say "upgrade PHP". The matrix
  # above only tests 8.5, where all of that is legal, so build a package and
  # compile the output on the oldest PHP the installer should still greet.
  legacy-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5 to build
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build installer files for a fixture app
        run: |
          app="$RUNNER_TEMP/fixture-app"
          mkdir -p "$app/package"
          echo '<?php return ["name" => "Fixture", "slug" => "fixture", "essential_seeders" => ["Database\\Seeders\\A"], "sample_seeders" => []];' > "$app/package/package-config.php"
          echo '{"require": {"php": "^8.5"}}' > "$app/composer.json"
          php bin/build "$app" "$RUNNER_TEMP/out"

      - name: Set up PHP 8.0 to compile
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Generated files compile on PHP 8.0
        run: |
          php -v | head -1
          for f in "$RUNNER_TEMP"/out/*.php; do php -l "$f"; done

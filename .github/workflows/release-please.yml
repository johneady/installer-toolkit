# Keeps one "chore(main): release X.Y.Z" PR open on main, rebuilt from the
# conventional commits merged since the last release. Merging that PR is the
# release: it tags vX.Y.Z and publishes a GitHub Release with the changelog.
# The job itself is release.yml, the same pipeline the apps call, with the
# package build turned off: this repository ships through Composer, not zips.
#
# Nobody edits a version number by hand. The release PR bumps
# .release-please-manifest.json and VERSION together (version-file in
# release-please-config.json), so the VERSION that bin/build stamps into every
# install.php/updater.php as INSTALLER_VERSION/UPDATER_VERSION always matches
# the tag Composer resolves the release from. ci.yml's version job still
# checks they agree, in case anything is edited or tagged by hand.
#
# release.yml documents the bump rules and the GITHUB_TOKEN consequences: "Allow
# GitHub Actions to create and approve pull requests" must be on, and ci.yml
# does not run on the release PR.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    # ./ runs release.yml from this same commit, so a change to it is used by
    # this repository's next release before any app pins the new version.
    uses: ./.github/workflows/release.yml
    with:
      package: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
